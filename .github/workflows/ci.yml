name: Integracion Continua - Hospital Vida Salud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Compilar y probar todos los modulos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas de todos los modulos
        working-directory: ${{ github.workspace }}
        run: ./mvnw --batch-mode verify

      - name: Reporte de pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7
